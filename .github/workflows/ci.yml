name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tms_test
          MYSQL_USER: tms_app
          MYSQL_PASSWORD: tms_dev_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TMS_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=tms_test;User=tms_app;Password=tms_dev_password;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build Tms.slnx --configuration Release
      - name: Vulnerable packages
        working-directory: backend
        run: |
          dotnet list Tms.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi
      - name: Test
        working-directory: backend
        run: dotnet test --solution Tms.slnx --configuration Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
